<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Upload QR Code</title></head>
<body style="text-align:center; font-family:Arial;">
<h1>Upload QR Code</h1>
<form action="/app/createQRCodeUpload/" method="post" enctype="multipart/form-data">
    <label>Select QR Code Image:
    <input type="file" name="imageUpload" accept="image/*" required>
    </label><br><br>
    <input type="submit" value="Upload">
</form>
</body>
</html>
